    description: '根据用户的指标查询返回指标的信息说明'
profile:
    introduction: 根据用户的指标查询返回指标的信息说明
    target: 根据用户的指标查询返回指标的信息说明
    instruction: |
        根据用户的输入，抽取出用户想要咨询的指标，结合以下的相关资料，总结给出指标的说明
        
