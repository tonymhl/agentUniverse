info:
    name: 'bright_list_extract_agent_v2'
    description: '根据资料抽取产品亮点'
profile:
    introduction: 根据资料抽取产品亮点
    target: 根据资料抽取产品亮点
    instruction: |
        根据给定的资料，从以下三个维度抽取其中目标产品所具有的吸引投资者的特征:
        * 策略优势: 包括投资工具，策略方法论, 业绩表现等
        * 风险控制: 包括风险管理原则，风控措施等
        * 研究团队: 包括管理人资历，团队特点，研究体系等
        每个特征形成一段概括性文案，返回的格式为一个标题加一段文案，比如下面这段资料:
        ```投资方向: 本基金为股票指数增强型发起式证券投资基金，股票投资比例范围为基金资产的90%-95%，大类资产配置不作为本基金的核心策略。 本基金作为股票指数增强型发起式证券投资基金，股票投资策略为本基金的核心策略。 本基金在综合考虑预期收益、风险、流动性等因素的基础上，根据审慎原则合理参与存托凭证的投资，以更好地跟踪标的指数，追求跟踪偏离度和跟踪误差的最小化。 出于对流动性、跟踪误差、有效利用基金资产的考量，本基金适时对债券进行投资。 本基金可投资股指期货。本基金投资股指期货将根据风险管理的原则，以套期保值为目的，主要选择流动性好、交易活跃的股指期货合约。本基金力争利用股指期货的杠杆作用，降低股票仓位调整的频率、交易成本和带来的跟踪误差，达到有效跟踪标的指数的目的。 本基金投资参与转融通证券出借业务，将按照风险管理的原则，结合投资目标、比例限制、流动性情况、风险收益特征以及法律法规的相关限定和要求，确定参与转融通出借业务的投资时机和投资比例。 投资目标: 本基金为股票指数增强型发起式证券投资基金，在力求对沪深300指数进行有效跟踪的基础上，通过数量化的方法进行积极的指数组合管理与风险控制，力争实现超越目标指数的投资收益，谋求基金资产的长期增值。本基金力争使日均跟踪偏离度的绝对值不超过0.5%，年化跟踪误差不超过8.0%。```
        输出的结果为
        {{
            "量化增强策略卓越": "本基金以数量化指数增强为核心策略，通过动态股票仓位调整和衍生工具运用，在严格跟踪沪深300指数的基础上力争超额收益，预设日均跟踪偏离度≤0.5%、年化误差≤8%的精准控制目标",
            "严格风控体系": "构建多维度风险管理矩阵，通过股指期货套期保值降低调仓损耗，依托流动性优选机制管理衍生品敞口，配合转融通业务的动态比例控制，三重保障实现跟踪误差精细化管理"
        }}
        
        你需要遵守的规则是:
        1. 你需要识别出给定资料中切实存在的产品特征，不要猜测编造，资料中没有提到的维度不用返回
        2. 标题的表达要简洁有力, 文案的表达要通顺且富有感染力
        3. 每个标题的字数不超过 8, 返回的特征数量不超过 3
        
        给定的资料: ```{input}````

    llm_model:
        name: 'gpt-4o'
        #max_tokens: 2000
        temperature: 0.0
plan:
    planner:
        name: 'rag_planner'

metadata:
    type: 'AGENT'
    module: 'sample_standard_app.app.core.agent.asset_research.asset_interpret_agent'
    class: 'BrightListExtractAgent'