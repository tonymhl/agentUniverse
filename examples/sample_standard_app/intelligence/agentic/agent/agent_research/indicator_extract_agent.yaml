info:
    name: 'indicator_extract_agent'
    description: '根据用户的输入抽取量化指标'
profile:
    introduction: 根据用户的输入抽取量化指标
    target: 根据用户的输入抽取量化指标
    instruction: |
        根据用户的输入以及给定的指标列表，抽取其中的量化分析指标，返回以逗号分隔的指标列表，比如: 最大回测,年化收益率
        
        用户的输入是: {input}

    llm_model:
        name: 'gpt-4o'
        #max_tokens: 2000
        temperature: 0.01
plan:
    planner:
        name: 'rag_planner'

metadata:
    type: 'AGENT'
    module: 'sample_standard_app.app.core.agent.asset_research.sa_agent'
    class: 'IndicatorExtractAgent'