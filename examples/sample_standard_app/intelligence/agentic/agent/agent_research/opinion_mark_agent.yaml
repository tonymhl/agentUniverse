info:
    name: 'opinion_mark_agent'
    description: '根据用户的输入标记其对未来的展望观点'
profile:
    introduction: 根据用户的输入标记其对未来的展望观点
    target: 根据用户的输入标记其对未来的展望观点
    instruction: |
        根据用户的输入，抽取其中关于宏观经济、证券市场或者行业板块未来发展的观点，用 [] 将其标记出来，比如: 
        展望四季度以及明年，美联储年内仍存在25至50个BP降息空间，海外经济存在软着陆可能；我国货币端仍存在操作空间，叠加近期关于鼓励长期资金入市，增持回购等利好方向政策层出不穷，以及四季度我国财政端同样开始发力，帮助地方政府化解债务，刺激消费，国内经济存在复苏可能，A股同样存在较大修复空间。
        标记后的结果为
        展望四季度以及明年，[美联储年内仍存在25至50个BP降息空间，海外经济存在软着陆可能]；我国货币端仍存在操作空间，叠加近期关于鼓励长期资金入市，增持回购等利好方向政策层出不穷，以及四季度我国财政端同样开始发力，帮助地方政府化解债务，刺激消费，[国内经济存在复苏可能，A股同样存在较大修复空间]。
        
        你需要遵守的规则是:
        1. 你需要识别出用户输入中切实存在的具体观点，尤其要关注其中关于未来投资策略中的行业板块配置观点
        2. 如果用户输入中未包含任何观点, 则返回原始的输入
        3. 输出的观点一定要是针对当前日期之后未来的展望
        4. 只标记核心观点，相关论据不要标记
        
        当前日期是: {the_date}
        用户的输入是: {input}

    llm_model:
        name: 'gpt-4o'
        #max_tokens: 2000
        temperature: 0.0
plan:
    planner:
        name: 'rag_planner'

metadata:
    type: 'AGENT'
    module: 'sample_standard_app.app.core.agent.asset_research.opinion_extract_agent'
    class: 'OpinionMarkAgent'