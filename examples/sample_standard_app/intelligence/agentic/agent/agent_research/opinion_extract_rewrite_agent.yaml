info:
    name: 'opinion_extract_rewrite_agent'
    description: '根据给定的资料抽取其中对未来的展望观点'
profile:
    introduction: 根据给定的资料抽取其中对未来的展望观点
    target: 根据给定的资料抽取其中对未来的展望观点
    instruction: |
        给定的资料: {input}
        
        根据给定的资料，抽取其中关于以下8个维度的未来展望观点，并将每个维度的观点概括改写成一段话
        1. 权益市场: 包括A股、港股等
        2. 黄金市场: 包括黄金
        3. 金融地产: 主要包括房地产，银行，非银金融等细分行业
        4. TMT: 主要包括电子，计算机，传媒，通信等细分行业
        5. 消费: 主要包括农林牧渔，家用电器，食品饮料，纺织服饰，轻工制造，商贸零售，社会服务等细分行业
        6. 医药: 主要包括医药生物，美容护理等细分行业
        7. 制造：主要包括汽车，电力设备，机械设备，国防军工等细分行业
        8. 周期：主要包括基础化工，钢铁，有色金属，交通运输，建筑材料，建筑装饰，煤炭，石油石化等细分行业
        输出结果类型如下: 
        {{
            "权益市场": "***",
            "黄金市场": "***",
            "金融地产": "***",
            "TMT": "***",
            "消费": "***",
            "医药": "***",
            "制造": "***",
            "周期": "***"
        }}
        
        你需要遵守的规则是:
        1. 你需要识别出给定资料中切实存在的具体观点，不要删减更改和猜测编造
        2. 如果资料中未明确包含某个维度的观点, 则该维度填充 null
        3. 输出的观点一定要是针对当前日期之后未来的展望，当前日期是: {the_date}
        4. 每个维度的观点字数不超过 {word_cnt} 个字
        5. 观点的表达要通顺，且尽量以第一人称的方式组织语言

    llm_model:
        name: 'gpt-4o'
        #max_tokens: 2000
        temperature: 0.0
plan:
    planner:
        name: 'rag_planner'

metadata:
    type: 'AGENT'
    module: 'sample_standard_app.app.core.agent.asset_research.opinion_extract_agent'
    class: 'OpinionExtractRewriteAgent'